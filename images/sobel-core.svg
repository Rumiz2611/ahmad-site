<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="20" y="30" font-size="12" fill="#5F5E5A">s_data[7:0], s_valid  (from RGB2Gray)</text>
<path d="M100 40 L100 140 L300 140 L300 156" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>

<text x="430" y="30" font-size="12" fill="#5F5E5A" text-anchor="middle">cfg_threshold, cfg_img_h, enable, start</text>
<line x1="430" y1="42" x2="430" y2="118" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<text x="660" y="30" font-size="12" fill="#5F5E5A" text-anchor="middle">busy, done, pkt_count, errors</text>
<line x1="660" y1="118" x2="660" y2="42" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="20" y="120" width="720" height="770" rx="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="38" y="146" font-size="15" fill="#04342C">Sobel core</text>

<rect x="36" y="160" width="160" height="690" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="116" y="186" font-size="14" fill="#412402" text-anchor="middle">Control</text>
<text x="50" y="216" font-size="12" fill="#633806">row / column counters</text>
<text x="50" y="238" font-size="12" fill="#633806">IMG_W param / IMG_H reg</text>
<text x="50" y="272" font-size="12" fill="#633806">window_valid generator</text>
<text x="50" y="294" font-size="12" fill="#633806">low for first 2W+3 px</text>
<text x="50" y="316" font-size="12" fill="#633806">and cols 0,1 each row</text>
<text x="50" y="350" font-size="12" fill="#633806">valid pipeline</text>
<text x="50" y="372" font-size="12" fill="#633806">5-deep, tracks Conv</text>
<text x="50" y="406" font-size="12" fill="#633806">shift_en gating</text>
<text x="50" y="428" font-size="12" fill="#633806">stalls whole datapath</text>
<text x="50" y="450" font-size="12" fill="#633806">on axis_prog_full</text>
<text x="50" y="484" font-size="12" fill="#633806">busy / done / intr</text>
<text x="50" y="518" font-size="12" fill="#633806">pkt_count increment</text>
<text x="50" y="552" font-size="12" fill="#633806">overflow_err, sync_err</text>
<text x="50" y="586" font-size="12" fill="#633806">width check:</text>
<text x="50" y="608" font-size="12" fill="#633806">IMG_W vs width reg</text>
<text x="50" y="630" font-size="12" fill="#633806">mismatch raises sync_err</text>

<line x1="200" y1="230" x2="208" y2="230" stroke="#854F0B" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="200" y1="520" x2="208" y2="520" stroke="#854F0B" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="200" y1="780" x2="208" y2="780" stroke="#854F0B" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="208" y1="815" x2="200" y2="815" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="212" y="160" width="508" height="140" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="228" y="184" font-size="14" fill="#26215C">IC — image control</text>

<rect x="224" y="196" width="230" height="90" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
<text x="339" y="220" font-size="13" fill="#26215C" text-anchor="middle">Shift-register line buffer</text>
<text x="339" y="244" font-size="11.5" fill="#534AB7" text-anchor="middle">2W+3 stages × 8b, 9 taps</text>
<text x="339" y="264" font-size="11.5" fill="#534AB7" text-anchor="middle">1 px/cycle when shift_en</text>

<rect x="478" y="196" width="230" height="90" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
<text x="593" y="220" font-size="13" fill="#26215C" text-anchor="middle">Boundary handling</text>
<text x="593" y="244" font-size="11.5" fill="#534AB7" text-anchor="middle">crop: window_valid low</text>
<text x="593" y="264" font-size="11.5" fill="#534AB7" text-anchor="middle">no padding, no false edge</text>

<line x1="339" y1="300" x2="339" y2="336" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<text x="350" y="322" font-size="11" fill="#5F5E5A">9 × 8b window + valid</text>

<rect x="212" y="340" width="508" height="360" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="228" y="364" font-size="14" fill="#4A1B0C">Conv — multiplier-free datapath</text>

<rect x="224" y="382" width="230" height="130" rx="6" fill="#FFFFFF" stroke="#993C1D" stroke-width="0.8"/>
<text x="339" y="406" font-size="13" fill="#4A1B0C" text-anchor="middle">Weighting</text>
<text x="339" y="430" font-size="11.5" fill="#993C1D" text-anchor="middle">4 × shift-by-1 (the ±2 taps)</text>
<text x="339" y="450" font-size="11.5" fill="#993C1D" text-anchor="middle">8 × pass-through (±1 taps)</text>
<text x="339" y="470" font-size="11.5" fill="#993C1D" text-anchor="middle">sign folds into adder tree</text>
<text x="339" y="492" font-size="11.5" fill="#993C1D" text-anchor="middle">no multipliers, no DSPs</text>

<line x1="456" y1="447" x2="474" y2="447" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="478" y="382" width="230" height="130" rx="6" fill="#FFFFFF" stroke="#993C1D" stroke-width="0.8"/>
<text x="593" y="406" font-size="13" fill="#4A1B0C" text-anchor="middle">Adder / subtract trees</text>
<text x="593" y="430" font-size="11.5" fill="#993C1D" text-anchor="middle">Gx: 6 terms, 3 stages</text>
<text x="593" y="450" font-size="11.5" fill="#993C1D" text-anchor="middle">Gy: 6 terms, in parallel</text>
<text x="593" y="470" font-size="11.5" fill="#993C1D" text-anchor="middle">each out: 11b signed</text>
<text x="593" y="492" font-size="11.5" fill="#993C1D" text-anchor="middle">range −1020 … +1020</text>

<line x1="593" y1="514" x2="593" y2="538" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="478" y="542" width="230" height="130" rx="6" fill="#FFFFFF" stroke="#993C1D" stroke-width="0.8"/>
<text x="593" y="566" font-size="13" fill="#4A1B0C" text-anchor="middle">Magnitude</text>
<text x="593" y="590" font-size="11.5" fill="#993C1D" text-anchor="middle">|Gx| + |Gy|</text>
<text x="593" y="610" font-size="11.5" fill="#993C1D" text-anchor="middle">approximates √(Gx²+Gy²)</text>
<text x="593" y="630" font-size="11.5" fill="#993C1D" text-anchor="middle">11b unsigned</text>
<text x="593" y="652" font-size="11.5" fill="#993C1D" text-anchor="middle">max value 2040</text>

<line x1="474" y1="607" x2="456" y2="607" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="224" y="542" width="230" height="130" rx="6" fill="#FFFFFF" stroke="#993C1D" stroke-width="0.8"/>
<text x="339" y="566" font-size="13" fill="#4A1B0C" text-anchor="middle">Threshold</text>
<text x="339" y="590" font-size="11.5" fill="#993C1D" text-anchor="middle">compare vs cfg_threshold</text>
<text x="339" y="610" font-size="11.5" fill="#993C1D" text-anchor="middle">11b is enough (was 12b)</text>
<text x="339" y="630" font-size="11.5" fill="#993C1D" text-anchor="middle">mux → 0x00 / 0xFF</text>
<text x="339" y="652" font-size="11.5" fill="#A32D2D" text-anchor="middle">default 4000 unreachable</text>

<line x1="339" y1="674" x2="339" y2="736" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<text x="350" y="712" font-size="11" fill="#5F5E5A">8b + valid</text>

<rect x="212" y="740" width="508" height="110" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="228" y="764" font-size="14" fill="#042C53">OB — output buffer</text>
<rect x="224" y="776" width="484" height="58" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.8"/>
<text x="466" y="799" font-size="13" fill="#042C53" text-anchor="middle">AXI-stream FIFO — asserts axis_prog_full as back-pressure</text>
<text x="466" y="821" font-size="11.5" fill="#185FA5" text-anchor="middle">if the stall is ignored, dropped pixels set overflow_err</text>

<line x1="380" y1="890" x2="380" y2="920" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<text x="380" y="940" font-size="12" fill="#5F5E5A" text-anchor="middle">m_axis_tdata[7:0], m_axis_tvalid  →  Gray2RGB</text>

<text x="20" y="966" font-size="11" fill="#888780">IMG_W is a compile-time parameter: shift-register taps are hard-wired, so width cannot change at runtime. SOBEL_IMG_WIDTH is checked against it.</text>
<text x="20" y="982" font-size="11" fill="#888780">Latency: 2W+3 cycles to fill the line buffer, then ~5 pipeline stages through Conv. Output is (W−2)×(H−2) — the 1 px border has no defined 3×3 window.</text>
</svg>
